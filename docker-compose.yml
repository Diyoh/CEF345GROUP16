version: "3.8"

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: buildright-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: buildright_db1
      MYSQL_USER: buildright_user
      MYSQL_PASSWORD: buildright_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d
    networks:
      - buildright-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: buildright-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: buildright_user
      DB_PASSWORD: buildright_pass
      DB_NAME: buildright_db1
      JWT_SECRET: your_secure_jwt_secret_change_in_production
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buildright-network
    volumes:
      - ./Backend/public:/app/public

  # Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: buildright-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - buildright-network

volumes:
  db_data:
    driver: local

networks:
  buildright-network:
    driver: bridge
