services:

  # MySQL. Published on 3310 because this machine already runs MySQL listeners on
  # both 3306 and 3307; inside the compose network it is still db:3306. The old ./Database init mount is gone on purpose: it replayed
  # stale backup dumps into every fresh database, resurrecting the pre-migration
  # schema. Schema now comes from our own scripts, the same path every other
  # environment uses: db:init, migrate, seed:entities, seed.
  db:
    image: mysql:8.0
    container_name: buildright-db
    restart: unless-stopped
    # Required for the append-only triggers on the audit log: MySQL 8 ships with
    # binary logging on, and without this flag CREATE TRIGGER demands SUPER,
    # which the application user deliberately does not have. Managed hosts
    # (Aiven) preset the equivalent, which is why it never surfaced before.
    command: --log-bin-trust-function-creators=1
    # Credentials come from .env beside this file (copy .env.example). Compose
    # stops with the message below instead of starting on a missing value.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?copy .env.example to .env}
      MYSQL_USER: ${MYSQL_USER:?copy .env.example to .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env}
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - buildright-network
    healthcheck:
      # 127.0.0.1 forces TCP. "localhost" uses the Unix socket, which answers
      # during first-boot initialization while TCP is still off, so the backend
      # was released before it could connect. $$ defers expansion to the
      # container, so the password is not baked into the config.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 20s
      retries: 20

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: buildright
    restart: unless-stopped
    ports:
      # 5001 on the host: a dev server (node) usually holds 5000 on this machine.
      # Inside the network the app still listens on 5000.
      - "5001:5000"
    # env_file brings optional settings kept out of this repo (Cloudinary).
    # Without it, image uploads are unavailable but everything else runs.
    # The environment block below overrides every database key, so whatever the
    # host .env points at, the container always talks to the compose database.
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_SSL: "false"
      # development, deliberately: the local stack should use the dev CORS
      # defaults (localhost origins) and skip the SSL that production forces.
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      LEDGER_HMAC_KEY: ${LEDGER_HMAC_KEY:?copy .env.example to .env}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buildright-network
    volumes:
      - ./Backend/public:/app/public
      # The image contains only Backend/. The schema scripts read
      # ../../Database from Backend/scripts, which resolves to /Database here,
      # so migrations and seeds can run inside the container:
      #   docker compose exec backend npm run db:init
      - ./Database:/Database:ro

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api/v1
    container_name: buildright-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - buildright-network

volumes:
  db_data:
    driver: local

networks:
  buildright-network:
    driver: bridge
