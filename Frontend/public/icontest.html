<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 monospace; padding: 16px; }
      pre { white-space: pre-wrap; }
      iframe { width: 1200px; height: 900px; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <iframe id="app" src="/#/projects"></iframe>
    <script>
      const out = document.getElementById('out');
      setTimeout(() => {
        try {
          const doc = document.getElementById('app').contentDocument;
          const lines = [];
          lines.push('fonts loaded: ' + Array.from(doc.fonts).map(f => f.family + '/' + f.weight + '=' + f.status).join(', '));
          lines.push('FA6 solid check: ' + doc.fonts.check('900 16px "Font Awesome 6 Free"'));
          const icons = Array.from(doc.querySelectorAll('i')).slice(0, 12);
          lines.push('icon count: ' + doc.querySelectorAll('i').length);
          icons.forEach((el) => {
            const cs = getComputedStyle(el);
            const before = getComputedStyle(el, '::before');
            lines.push(
              el.className.split(' ').slice(0, 2).join(' ') +
                ' | el-font=' + cs.fontFamily +
                ' | before-font=' + before.fontFamily +
                ' | content=' + before.content +
                ' | weight=' + before.fontWeight
            );
          });
          out.textContent = lines.join('\n');
        } catch (e) {
          out.textContent = 'ERR ' + e.message;
        }
      }, 5000);
    </script>
  </body>
</html>
