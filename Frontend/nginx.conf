# Serves the built React app. The app routes with HashRouter (/#/projects), so
# the server only ever sees "/"; the index.html fallback is a safety net should
# the app move to path-based routing.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change under the same name: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must be re-fetched so a new deploy is picked up at once.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
