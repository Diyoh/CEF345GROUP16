<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildRight - Infrastructure Transparency</title>
    <meta
      name="description"
      content="Track public infrastructure projects across Cameroon: progress, budget spent, status, photos and citizen reports."
    />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1613" media="(prefers-color-scheme: dark)" />

    <!-- Applies the stored theme before first paint so the page never flashes the
         wrong background. Must stay inline and blocking for that reason. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('br-theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- TODO(phase5): replaced by the local SVG sprite once every icon call site is
         migrated. Kept until then so the 31 icons currently in use keep rendering. -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
