<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildRight - Infrastructure Transparency</title>
    <meta
      name="description"
      content="Track public infrastructure projects across Cameroon: progress, budget spent, status, photos and citizen reports."
    />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1613" media="(prefers-color-scheme: dark)" />

    <!-- Applies the stored theme before first paint so the page never flashes the
         wrong background. Must stay inline and blocking for that reason. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('br-theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Icons are now bundled from the @fortawesome/fontawesome-free package, imported
         in src/index.jsx. Do not reintroduce a CDN <link> here: a blocked external
         request turned every icon on the site into a tofu box.
         TODO(phase5): still to be replaced by the local SVG sprite once every icon
         call site is migrated. -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* TEMP-ICON-PROBE */
      setTimeout(function () {
        var out = [];
        out.push('FA6check=' + document.fonts.check('900 16px "Font Awesome 6 Free"'));
        out.push('loaded=' + Array.from(document.fonts).map(f => f.family + ':' + f.status).join('|'));
        Array.from(document.querySelectorAll('i')).slice(0, 8).forEach(function (el) {
          var b = getComputedStyle(el, '::before');
          out.push(el.className.split(' ').slice(0, 2).join('.') + ' font=[' + b.fontFamily + '] w=' + b.fontWeight + ' c=' + b.content);
        });
        var pre = document.createElement('pre');
        pre.id = 'icon-probe';
        pre.textContent = 'PROBE_START ' + out.join(' ;; ') + ' PROBE_END';
        document.body.appendChild(pre);
      }, 9000);
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
